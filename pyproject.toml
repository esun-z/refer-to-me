[project]
name = "refer-to-me"
version = "0.1.0"
description = "Watch incoming messages, classify them against your topics (keywords -> Laya -> optional LLM), and alert per topic."
readme = "README.md"
authors = [
    { name = "esun-z", email = "esun_zhao@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "laya>=0.4.31,<0.5",
    "pyside6>=6.8",
    "pyside6-fluent-widgets>=1.11,<2",
    "windows-toasts>=1.3.1; sys_platform == 'win32'",
    "instructor>=1.17.0,<2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "torch>=2.6",
]

[project.scripts]
refer-to-me = "refer_to_me:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
